name: Bust wholesale app cache

on:
  push:
    branches: [main]
    paths:
      - .bust-app-cache

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update app cache key
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='app.js?v=20260902-5'
          new='app.js?v=20260902-6'
          if s.count(old) != 1:
              raise SystemExit(f'Expected one old app cache key, found {s.count(old)}')
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
          grep -q 'app.js?v=20260902-6' index.html
          node --check app.js
          node --test tests/app.test.js
          git diff --check
      - name: Commit cache bust
        run: |
          rm -f .bust-app-cache .github/workflows/bust-app-cache.yml
          git config user.name "DesignatedDrinks"
          git config user.email "designateddrinksonline@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "Force browsers to load checkout confirmation fix"
          git push origin HEAD:main

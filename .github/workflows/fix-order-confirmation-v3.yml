name: Fix wholesale false confirmation error

on:
  push:
    branches: [main]
    paths:
      - .confirmation-hotfix-v3

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch false failure path
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.js')
          s=p.read_text(encoding='utf-8')

          old='''  async function pollOrderStatus(getPostError) {
            const startedAt = Date.now();
            let lastError = null;
            await wait(140);
            while (Date.now() - startedAt < CONFIG.orderConfirmTimeoutMs) {
              const postError = typeof getPostError === "function" ? getPostError() : null;
              if (postError) throw postError;
          '''
          # Source is two-space indented; locate by semantic anchors instead of whitespace.
          poll_start=s.index('  async function pollOrderStatus(getPostError) {')
          while_pos=s.index('    while (Date.now() - startedAt < CONFIG.orderConfirmTimeoutMs) {', poll_start)
          state_start=s.index('      const postError = typeof getPostError === "function" ? getPostError() : null;', while_pos)
          state_end=s.index('\n      try {', state_start)
          s=s[:state_start] + '''      const postState = typeof getPostState === "function" ? getPostState() : null;
              if (postState && postState.error) throw postState.error;''' + s[state_end:]
          s=s.replace('  async function pollOrderStatus(getPostError) {', '''  function isStatusTransportError(error) {
            const message = error && error.message ? String(error.message) : String(error || "");
            return /The request could not be completed\\.|The request timed out\\./i.test(message);
          }

          function transportConfirmedStatus() {
            return {
              status: "success",
              stage: "transport-confirmed",
              orderId: "Confirmed",
              emailStatus: "sent",
              transportConfirmed: true
            };
          }

          async function pollOrderStatus(getPostState) {''', 1)

          catch_old='''      } catch (error) {
                lastError = error;
                if (error && /could not be processed|missing|required|unavailable|valid|only \\d+ case/i.test(error.message || "")) throw error;
              }
          '''
          catch_new='''      } catch (error) {
                lastError = error;
                if (error && /could not be processed|missing|required|unavailable|valid|only \\d+ case/i.test(error.message || "")) throw error;
                const currentPostState = typeof getPostState === "function" ? getPostState() : null;
                if (currentPostState && currentPostState.completed && !currentPostState.error && isStatusTransportError(error)) {
                  console.warn("Status callback failed after completed order POST; using POST completion as confirmation.", error);
                  return transportConfirmedStatus();
                }
              }
          '''
          # Normalize indentation from actual source for replacement.
          actual='''      } catch (error) {
                lastError = error;
                if (error && /could not be processed|missing|required|unavailable|valid|only \\d+ case/i.test(error.message || "")) throw error;
              }
          '''
          # Find by the unique lastError line and closing wait instead of relying on YAML indentation.
          cstart=s.index('      } catch (error) {', poll_start)
          cend=s.index('\n      await wait(CONFIG.statusPollMs);', cstart)
          block=s[cstart:cend]
          if 'lastError = error;' not in block or 'only \\d+ case' not in block:
              raise SystemExit('Unexpected poll catch block')
          replacement='''      } catch (error) {
                lastError = error;
                if (error && /could not be processed|missing|required|unavailable|valid|only \\d+ case/i.test(error.message || "")) throw error;
                const currentPostState = typeof getPostState === "function" ? getPostState() : null;
                if (currentPostState && currentPostState.completed && !currentPostState.error && isStatusTransportError(error)) {
                  console.warn("Status callback failed after completed order POST; using POST completion as confirmation.", error);
                  return transportConfirmedStatus();
                }
              }'''
          # Re-indent replacement to match the function's two-space style.
          replacement=replacement.replace('              ', '      ')
          s=s[:cstart]+replacement+s[cend:]

          submit=s.index('  async function submitCheckout(event) {')
          ps=s.index('    let postError = null;', submit)
          pe=s.index('\n\n    try {', ps)
          old_post=s[ps:pe]
          if 'postOrder(body)' not in old_post:
              raise SystemExit('Unexpected post block')
          new_post='''    const postState = { completed: false, error: null };
            const body = buildOrderBody(data, totals);
            postOrder(body).then(function (result) {
              postState.completed = Boolean(result);
            }).catch(function (error) {
              postState.error = error;
            });'''.replace('            ', '    ')
          s=s[:ps]+new_post+s[pe:]
          s=s.replace('const status = await pollOrderStatus(function () { return postError; });', 'const status = await pollOrderStatus(function () { return postState; });', 1)

          export_anchor='    shouldBodyBeLocked: shouldBodyBeLocked\n'
          if export_anchor not in s:
              raise SystemExit('Export anchor missing')
          s=s.replace(export_anchor, '    shouldBodyBeLocked: shouldBodyBeLocked,\n    isStatusTransportError: isStatusTransportError\n', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Add regression test
        shell: bash
        run: |
          cat >> tests/app.test.js <<'TESTS'

          test("status callback network errors are distinguishable from server errors", () => {
            assert.equal(app.isStatusTransportError(new Error("The request could not be completed.")), true);
            assert.equal(app.isStatusTransportError(new Error("The request timed out.")), true);
            assert.equal(app.isStatusTransportError(new Error("A selected product is unavailable.")), false);
          });
          TESTS

      - name: Verify
        shell: bash
        run: |
          node --check app.js
          node --test tests/app.test.js
          grep -q 'transport-confirmed' app.js
          grep -q 'currentPostState.completed' app.js
          git diff --check

      - name: Commit hotfix
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('package.json')
          data=json.loads(p.read_text())
          data['version']='8.0.2'
          p.write_text(json.dumps(data, indent=2)+'\n')
          PY
          rm -f .confirmation-hotfix .confirmation-hotfix-v3
          rm -f .github/workflows/fix-order-confirmation.yml .github/workflows/fix-order-confirmation-v3.yml
          git config user.name "DesignatedDrinks"
          git config user.email "designateddrinksonline@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix false checkout error after successful order"
          git push origin HEAD:main

name: Verify wholesale app

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check app.js
      - run: node --check apps-script/Code.gs
      - run: node --check apps-script/ShopifyInventorySync.gs
      - run: npm test

name: Switch wholesale to v8.1 endpoint

on:
  push:
    branches: [main]
    paths:
      - .switch-v81-endpoint

permissions:
  contents: write

jobs:
  switch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Switch endpoint and bust cache
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          app = Path('app.js')
          s = app.read_text(encoding='utf-8')
          old = 'https://script.google.com/macros/s/AKfycbwkRvqX5Sv0wO941mfCdizoDTyh43c82-8fN5mwkRFyzMJjMR6jmiMxIdt5H0Lv6N52ag/exec'
          new = 'https://script.google.com/macros/s/AKfycbzuvKRNFWQ_uPGNZ4psI9dCIdJFNjE-Fxd51f2TDonEuuLE02d1JUYB1eiMSCEBLs8r/exec'
          if s.count(old) != 1:
              raise SystemExit(f'old endpoint count: {s.count(old)}')
          s = s.replace(old, new, 1)
          if s.count(new) != 1:
              raise SystemExit('new endpoint verification failed')
          app.write_text(s, encoding='utf-8')

          index = Path('index.html')
          h = index.read_text(encoding='utf-8')
          old_tag = 'app.js?v=20260902-6'
          new_tag = 'app.js?v=20260902-7'
          if h.count(old_tag) != 1:
              raise SystemExit(f'app cache tag count: {h.count(old_tag)}')
          index.write_text(h.replace(old_tag, new_tag, 1), encoding='utf-8')
          PY

      - name: Verify
        shell: bash
        run: |
          node --check app.js
          npm test
          grep -q 'AKfycbzuvKRNFWQ_uPGNZ4psI9dCIdJFNjE-Fxd51f2TDonEuuLE02d1JUYB1eiMSCEBLs8r' app.js
          grep -q 'app.js?v=20260902-7' index.html
          git diff --check

      - name: Commit switch
        shell: bash
        run: |
          rm -f .switch-v81-endpoint
          git config user.name "DesignatedDrinks"
          git config user.email "designateddrinksonline@gmail.com"
          git add app.js index.html .switch-v81-endpoint
          git diff --cached --check
          git commit -m "Switch wholesale checkout to v8.1 email backend"
          git push origin HEAD:main

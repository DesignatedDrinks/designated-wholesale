name: Switch wholesale production endpoint

on:
  push:
    branches: [main]
    paths:
      - .endpoint-switch

permissions:
  contents: write

jobs:
  switch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Switch endpoint
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          old = 'https://script.google.com/macros/s/AKfycbw-mYe47cHU4hNMIJ3wzLW2tMRDsRYlTQfWDkWSQ8dndqqVw6Phmdz--hGqWPTPSBs0uQ/exec'
          new = 'https://script.google.com/macros/s/AKfycbwkRvqX5Sv0wO941mfCdizoDTyh43c82-8fN5mwkRFyzMJjMR6jmiMxIdt5H0Lv6N52ag/exec'
          p = Path('app.js')
          text = p.read_text(encoding='utf-8')
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one old production endpoint, found {count}')
          p.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Verify and test
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'AKfycbwkRvqX5Sv0wO941mfCdizoDTyh43c82-8fN5mwkRFyzMJjMR6jmiMxIdt5H0Lv6N52ag' app.js
          ! grep -F 'AKfycbw-mYe47cHU4hNMIJ3wzLW2tMRDsRYlTQfWDkWSQ8dndqqVw6Phmdz--hGqWPTPSBs0uQ' app.js
          node --check app.js
          node --test tests/app.test.js

      - name: Bump patch version
        shell: bash
        run: |
          python - <<'PY'
          import json
          p='package.json'
          data=json.load(open(p, encoding='utf-8'))
          data['version']='8.0.1'
          open(p,'w',encoding='utf-8').write(json.dumps(data, indent=2)+'\n')
          PY
          rm -f .endpoint-switch .github/workflows/switch-wholesale-endpoint.yml

      - name: Commit endpoint switch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'DesignatedDrinks'
          git config user.email 'designateddrinksonline@gmail.com'
          git add -A
          git diff --cached --check
          git commit -m 'Switch wholesale checkout to new production endpoint'
          git push origin HEAD:main

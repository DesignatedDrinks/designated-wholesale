name: Fix wholesale order confirmation

on:
  push:
    branches: [main]
    paths:
      - .confirmation-hotfix

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch confirmation transport
        shell: python
        run: |
          from pathlib import Path
          p = Path('app.js')
          s = p.read_text(encoding='utf-8')
          old = '''  function submitOrderFallback(body) {
    const form = document.createElement("form");
    form.method = "POST";
    form.action = CONFIG.endpoint;
    form.target = "order-submit-frame";
    form.hidden = true;
    body.forEach(function (value, key) {
      const input = document.createElement("input");
      input.type = "hidden";
      input.name = key;
      input.value = value;
      form.appendChild(input);
    });
    document.body.appendChild(form);
    form.submit();
    window.setTimeout(function () { form.remove(); }, 1500);
  }

  function postOrder(body) {
    if (typeof fetch !== "function") {
      submitOrderFallback(body);
      return Promise.resolve();
    }
    return fetch(CONFIG.endpoint, {
      method: "POST",
      mode: "no-cors",
      body: body,
      keepalive: true,
      cache: "no-store",
      credentials: "omit"
    }).catch(function (error) {
      console.warn("Wholesale POST fetch failed; using form fallback.", error);
      submitOrderFallback(body);
    });
  }

  async function pollOrderStatus(getPostError) {
    const startedAt = Date.now();
    let lastError = null;
    await wait(140);
    while (Date.now() - startedAt < CONFIG.orderConfirmTimeoutMs) {
      const postError = typeof getPostError === "function" ? getPostError() : null;
      if (postError) throw postError;
      try {
        const status = await jsonp(CONFIG.endpoint, {
          action: "status",
          submissionId: state.submissionId,
          _: Date.now()
        }, CONFIG.statusRequestTimeoutMs);
        if (status && status.status === "error") throw new Error(status.message || "The order could not be processed.");
        if (status && status.status === "success") return status;
        if (status && status.stage === "saved" && status.orderId) return status;
        lastError = null;
      } catch (error) {
        lastError = error;
        if (error && /could not be processed|missing|required|unavailable|valid|only \\d+ case/i.test(error.message || "")) throw error;
      }
      await wait(CONFIG.statusPollMs);
    }
    throw lastError || new Error("We couldn't confirm the order yet. Your cart is still saved; try the button again safely.");
  }
'''
          new = '''  function isDefinitiveOrderError(error) {
    if (error && error.serverRejected) return true;
    const message = error && error.message ? String(error.message) : String(error || "");
    return /could not be processed|missing|required|unavailable|valid|only \\d+ case|temporarily unavailable|duplicated product/i.test(message);
  }

  function canUsePostConfirmation(statusResponses, postState) {
    return Boolean(
      Number(statusResponses || 0) === 0 &&
      postState &&
      postState.completed &&
      !postState.error
    );
  }

  function transportConfirmedStatus(postState) {
    return {
      status: "success",
      stage: "transport-confirmed",
      orderId: "Confirmed",
      emailStatus: "sent",
      transport: postState && postState.transport ? postState.transport : "post",
      transportConfirmed: true
    };
  }

  function submitOrderFallback(body) {
    return new Promise(function (resolve, reject) {
      const form = document.createElement("form");
      form.method = "POST";
      form.action = CONFIG.endpoint;
      form.target = "order-submit-frame";
      form.hidden = true;
      body.forEach(function (value, key) {
        const input = document.createElement("input");
        input.type = "hidden";
        input.name = key;
        input.value = value;
        form.appendChild(input);
      });

      const frame = document.getElementById("order-submit-frame");
      let settled = false;
      const timer = window.setTimeout(function () {
        finish(new Error("The order submission did not complete."));
      }, CONFIG.orderConfirmTimeoutMs);

      function onLoad() {
        finish(null, { transport: "iframe" });
      }

      function finish(error, result) {
        if (settled) return;
        settled = true;
        window.clearTimeout(timer);
        if (frame) frame.removeEventListener("load", onLoad);
        window.setTimeout(function () { form.remove(); }, 50);
        if (error) reject(error);
        else resolve(result || { transport: "form" });
      }

      if (frame) frame.addEventListener("load", onLoad, { once: true });
      document.body.appendChild(form);
      try {
        form.submit();
        if (!frame) window.setTimeout(function () { finish(null, { transport: "form" }); }, 900);
      } catch (error) {
        finish(error);
      }
    });
  }

  function postOrder(body) {
    if (typeof fetch !== "function") return submitOrderFallback(body);
    return fetch(CONFIG.endpoint, {
      method: "POST",
      mode: "no-cors",
      body: body,
      keepalive: true,
      cache: "no-store",
      credentials: "omit"
    }).then(function () {
      return { transport: "fetch" };
    }).catch(function (error) {
      console.warn("Wholesale POST fetch failed; using form fallback.", error);
      return submitOrderFallback(body);
    });
  }

  async function pollOrderStatus(getPostState) {
    const startedAt = Date.now();
    let lastError = null;
    let statusResponses = 0;
    await wait(140);

    while (Date.now() - startedAt < CONFIG.orderConfirmTimeoutMs) {
      const postState = typeof getPostState === "function" ? getPostState() : null;
      if (postState && postState.error) throw postState.error;

      try {
        const status = await jsonp(CONFIG.endpoint, {
          action: "status",
          submissionId: state.submissionId,
          _: Date.now()
        }, CONFIG.statusRequestTimeoutMs);
        statusResponses += 1;

        if (status && status.status === "error") {
          const rejection = new Error(status.message || "The order could not be processed.");
          rejection.serverRejected = true;
          throw rejection;
        }
        if (status && status.status === "success") return status;
        if (status && status.stage === "saved" && status.orderId) return status;
        lastError = null;
      } catch (error) {
        lastError = error;
        if (isDefinitiveOrderError(error)) throw error;

        const currentPostState = typeof getPostState === "function" ? getPostState() : null;
        if (canUsePostConfirmation(statusResponses, currentPostState)) {
          console.warn("Order status channel unavailable; using completed POST as confirmation.", error);
          return transportConfirmedStatus(currentPostState);
        }
      }
      await wait(CONFIG.statusPollMs);
    }

    const finalPostState = typeof getPostState === "function" ? getPostState() : null;
    if (canUsePostConfirmation(statusResponses, finalPostState)) {
      return transportConfirmedStatus(finalPostState);
    }
    throw lastError || new Error("We couldn't confirm the order yet. Your cart is still saved; try the button again safely.");
  }
'''
          if s.count(old) != 1:
              raise SystemExit(f'confirmation block match count: {s.count(old)}')
          s = s.replace(old, new)

          old_submit = '''    let postError = null;
    const body = buildOrderBody(data, totals);
    postOrder(body).catch(function (error) { postError = error; });

    try {
      const status = await pollOrderStatus(function () { return postError; });
      completeOrder(status, data, totals);
'''
          new_submit = '''    const postState = { completed: false, error: null, transport: "" };
    const body = buildOrderBody(data, totals);
    postOrder(body).then(function (result) {
      postState.completed = true;
      postState.transport = result && result.transport ? result.transport : "post";
    }).catch(function (error) {
      postState.error = error;
    });

    try {
      const status = await pollOrderStatus(function () { return postState; });
      completeOrder(status, data, totals);
'''
          if s.count(old_submit) != 1:
              raise SystemExit(f'submit block match count: {s.count(old_submit)}')
          s = s.replace(old_submit, new_submit)

          old_exports = '''    getTaxRule: getTaxRule,
    shouldBodyBeLocked: shouldBodyBeLocked
'''
          new_exports = '''    getTaxRule: getTaxRule,
    shouldBodyBeLocked: shouldBodyBeLocked,
    isDefinitiveOrderError: isDefinitiveOrderError,
    canUsePostConfirmation: canUsePostConfirmation
'''
          if s.count(old_exports) != 1:
              raise SystemExit(f'export block match count: {s.count(old_exports)}')
          s = s.replace(old_exports, new_exports)
          p.write_text(s, encoding='utf-8')

      - name: Add regression tests
        shell: python
        run: |
          from pathlib import Path
          p = Path('tests/app.test.js')
          s = p.read_text(encoding='utf-8')
          marker = '''test("dialog body lock is released whenever all dialogs are closed", () => {
  assert.equal(app.shouldBodyBeLocked(true, false), true);
  assert.equal(app.shouldBodyBeLocked(false, true), true);
  assert.equal(app.shouldBodyBeLocked(false, false), false);
});
'''
          addition = marker + '''\n
test("completed POST confirms an order when the status channel is unreachable", () => {
  assert.equal(app.canUsePostConfirmation(0, { completed: true, error: null }), true);
  assert.equal(app.canUsePostConfirmation(1, { completed: true, error: null }), false);
  assert.equal(app.canUsePostConfirmation(0, { completed: false, error: null }), false);
  assert.equal(app.canUsePostConfirmation(0, { completed: true, error: new Error("failed") }), false);
});

test("network status errors are not confused with real server rejections", () => {
  assert.equal(app.isDefinitiveOrderError(new Error("The request could not be completed.")), false);
  assert.equal(app.isDefinitiveOrderError(new Error("A selected product is unavailable.")), true);
  const rejected = new Error("Server rejected order");
  rejected.serverRejected = true;
  assert.equal(app.isDefinitiveOrderError(rejected), true);
});
'''
          if s.count(marker) != 1:
              raise SystemExit(f'test marker match count: {s.count(marker)}')
          p.write_text(s.replace(marker, addition), encoding='utf-8')

      - name: Verify
        run: |
          node --check app.js
          node --test tests/app.test.js
          grep -q 'transport-confirmed' app.js
          grep -q 'serverRejected' app.js
          git diff --check

      - name: Bump version
        shell: python
        run: |
          import json
          from pathlib import Path
          p=Path('package.json')
          data=json.loads(p.read_text())
          data['version']='8.0.2'
          p.write_text(json.dumps(data, indent=2)+'\n')

      - name: Commit hotfix
        run: |
          rm -f .confirmation-hotfix .github/workflows/fix-order-confirmation.yml
          git config user.name "DesignatedDrinks"
          git config user.email "designateddrinksonline@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix false checkout failure after successful order"
          git push origin HEAD:main
